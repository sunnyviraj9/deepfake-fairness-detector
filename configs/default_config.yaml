# Default Configuration for Deepfake Detector & Fairness Benchmark

# Dataset & Data Paths
annotations: "./data/mock_dataset/annotations.csv"
data_root: null
image_size: 224
batch_size: 16
num_workers: 0  # 0 for Windows multiprocessing stability

# Model Architecture
model_type: "spatial"  # Options: 'spatial', 'frequency', 'dual_stream'
backbone: "efficientnet_b0"  # timm backbones: 'efficientnet_b0', 'efficientnet_b4', 'resnet34', 'resnet50'
dropout: 0.3
pretrained: true

# Training Hyperparameters
epochs: 10
lr: 0.0001
weight_decay: 0.01

# Algorithmic Fairness & Loss Mitigation
loss_type: "equalized_odds"  # Options: 'bce', 'subgroup_reweighted', 'equalized_odds'
lambda_fair: 0.5            # Multiplier for Equalized Odds fairness penalty
mitigate_bias: true         # Enables subgroup-balanced sampling and fairness loss

# Output & Logging
output_dir: "./checkpoints"
results_dir: "./results"
seed: 42
